services:
  web:
    build: .
    container_name: web
    command: sh -c "python manage.py makemigrations &&
        python manage.py migrate &&
        python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "80:8000"
    environment:
      - SECRET_KEY=test
      - DEBUG=True